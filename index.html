<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>گالری بازیگران</title>

    <!-- Tailwind (مثل Update.html) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"
        type="text/css" />

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f172a;
            color: #e6eef8;
        }

        .glass {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .custom-scroll::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 999px;
        }

        .actor-card img {
            transition: transform .4s ease, filter .4s ease;
        }

        .actor-card:hover img {
            transform: scale(1.03);
            filter: none;
        }

        .modal-fade {
            animation: modalIn .18s ease-out both;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(.995);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .icon-sm {
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Top bar -->
    <nav class="h-16 flex items-center justify-between px-6 glass z-40">
        <div class="flex items-center gap-4">
            <i data-lucide="menu" class="text-slate-300 w-6 h-6 cursor-pointer"></i>
            <h1 class="text-lg font-bold bg-gradient-to-l from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                گالری بازیگران</h1>
        </div>

        <div class="flex-1 max-w-xl mx-6 relative">
            <input id="searchInput" type="text" placeholder="جستجوی نام..."
                class="w-full rounded-full bg-slate-800 border border-slate-700 py-2 px-10 text-sm focus:outline-none" />
            <i data-lucide="search" class="absolute right-3 top-2.5 text-slate-400 w-4 h-4"></i>
        </div>

        <div class="flex items-center gap-3">
            <button id="toggleFavorites" class="relative p-2 rounded-full hover:bg-slate-800">
                <i data-lucide="heart" class="w-6 h-6 text-slate-200"></i>
                <span id="favCount"
                    class="absolute -top-1 -right-1 bg-red-500 text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold">A</div>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside
            class="w-72 p-6 border-l border-slate-700 glass hidden lg:flex flex-col gap-6 overflow-y-auto custom-scroll">
            <div>
                <h3 class="text-sm font-semibold text-slate-400 mb-4 flex items-center gap-2">
                    <i data-lucide="filter" class="w-4 h-4"></i> فیلترها
                </h3>

                <div class="space-y-5">
                    <div>
                        <label class="text-xs text-slate-400 mb-2 block">جنسیت</label>
                        <div class="flex gap-2">
                            <button data-gender="all"
                                class="gender-btn px-3 py-1 rounded-md text-xs bg-blue-600 active">همه</button>
                            <button data-gender="مرد"
                                class="gender-btn px-3 py-1 rounded-md text-xs bg-slate-800">مرد</button>
                            <button data-gender="زن"
                                class="gender-btn px-3 py-1 rounded-md text-xs bg-slate-800">زن</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 mb-2 flex justify-between items-center">
                            <span>حداکثر/حداقل سن (قابل تغییر)</span>
                            <span id="ageLabel" class="text-xs text-slate-300">حداکثر: 90</span>
                        </label>
                        <input id="ageRange" type="range" min="15" max="100" value="90" class="w-full" />
                        <div class="mt-2 flex items-center gap-2">
                            <button id="ageDir" class="px-2 py-1 rounded bg-slate-800 text-xs">جهت: بالا</button>
                            <select id="sortOrder" class="bg-slate-800 rounded text-xs p-1">
                                <option value="name">مرتب‌سازی: نام</option>
                                <option value="ageDesc">سن: بیشترین</option>
                                <option value="ageAsc">سن: کمترین</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-auto p-4 text-center text-xs text-slate-400 bg-slate-800/40 rounded">
                دیتای برنامه از فایل لوکال baz.json بارگذاری می‌شود.
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 overflow-y-auto p-6">
            <div id="actorsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6"></div>

            <div id="noResults" class="hidden mt-12 text-center text-slate-500">
                <i data-lucide="search-x" class="w-16 h-16 opacity-20 mx-auto"></i>
                <p class="mt-4">هیچ نتیجه‌ای یافت نشد.</p>
            </div>
        </main>

        <div id="favoritesView" class="hidden flex-1 overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-red-500">علاقه‌مندی‌های شما</h2>
                <button id="favBackBtn" class="px-3 py-1 rounded bg-slate-800">بازگشت</button>
            </div>
            <div id="favoritesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6"></div>
            <div id="noFavs" class="hidden mt-12 text-center text-slate-500">
                <i data-lucide="heart" class="w-16 h-16 opacity-20 mx-auto"></i>
                <p class="mt-4">شما هیچ علاقه‌مندی‌ای ندارید.</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="actorModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div id="modalOverlay" class="absolute inset-0 bg-black/70"></div>
        <div
            class="relative w-full max-w-4xl max-h-[90vh] glass rounded-3xl overflow-hidden modal-fade flex flex-col md:flex-row">
            <button id="modalCloseBtn" class="absolute top-4 left-4 z-20 p-2 rounded-full bg-black/40">
                <i data-lucide="x" class="w-5 h-5 text-white"></i>
            </button>

            <div class="md:w-2/5 h-64 md:h-auto relative">
                <img id="modalImg" src="" alt="" class="w-full h-full object-cover">
            </div>

            <div class="md:w-3/5 p-6 overflow-y-auto flex flex-col gap-4">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 id="modalName" class="text-2xl font-black"></h2>
                        <div id="modalTags" class="flex gap-2 text-xs text-blue-400"></div>
                    </div>
                    <button id="modalFavBtn" class="p-3 rounded-2xl bg-slate-800 hover:bg-slate-700">
                        <i data-lucide="heart" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-800/40 p-3 rounded border border-slate-700">
                        <span class="text-xs text-slate-400">سن</span>
                        <div id="modalAge" class="font-bold"></div>
                    </div>
                    <div class="bg-slate-800/40 p-3 rounded border border-slate-700">
                        <span class="text-xs text-slate-400">وضعیت</span>
                        <div id="modalStatus" class="font-bold text-green-400"></div>
                    </div>
                </div>

                <div>
                    <h4 class="text-sm font-bold mb-2">بیوگرافی</h4>
                    <p id="modalBio" class="text-sm text-slate-300 leading-7 max-h-40 overflow-y-auto pr-2"></p>
                </div>

                <div>
                    <h4 class="text-sm font-bold mb-2">آلبوم</h4>
                    <div id="modalGallery" class="flex gap-2 overflow-x-auto pb-2 custom-scroll"></div>
                </div>

                <div class="mt-auto flex gap-3">
                    <a id="wikiLink" target="_blank" class="flex-1 bg-blue-600 py-3 rounded-xl text-center">مشاهده در
                        ویکی‌پدیا</a>
                    <button id="downloadBtn" class="px-4 bg-slate-800 rounded-xl">دانلود تصویر</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // داده‌ها از baz.json بارگذاری می‌شوند (طبق خواسته)
        let data = [];
        const placeholder = 'https://via.placeholder.com/400x600?text=تصویر+موجود+نیست';
        let favorites = JSON.parse(localStorage.getItem('favs')) || [];
        const cache = { images: {}, wikiExtracts: {}, album: {} };

        const filters = {
            search: '',
            gender: 'all',
            ageLimit: 90,
            ageDirection: 'up', // 'up' => سن >= ageLimit, 'down' => سن <= ageLimit
            sortBy: 'name'
        };

        // Helpers (jQuery-based)
        function setFavCount() { $('#favCount').text(favorites.length); }

        function saveFavs() { localStorage.setItem('favs', JSON.stringify(favorites)); setFavCount(); }

        function getImageLocal(path) {
            // تست وجود تصویر لوکال با بارگذاری Image
            return new Promise(resolve => {
                const img = new Image();
                img.src = 'img/' + path;
                img.onload = () => resolve(img.src);
                img.onerror = () => resolve(null);
            });
        }

        // اصلاح تابع fetchPersonImage برای بررسی بهتر تصاویر محلی و کش محلی
        async function fetchPersonImage(person) {
            if (cache.images[person.id]) return cache.images[person.id];

            const lsKey = `image_${person.id}`;
            const lsWikiKey = `wikiImage_${person.id}`;
            const lsCached = localStorage.getItem(lsKey);
            if (lsCached) { cache.images[person.id] = lsCached; return lsCached; }

            // اگر آبجکت image دارد
            if (person.image) {
                // اگر URL کامل است
                if (/^https?:\/\//.test(person.image)) {
                    localStorage.setItem(lsKey, person.image);
                    cache.images[person.id] = person.image;
                    return person.image;
                }

                // اگر مسیر نسبی است
                const localPath = `img/${person.image}`;
                try {
                    const response = await fetch(localPath, { method: 'HEAD' });
                    if (response.ok) {
                        localStorage.setItem(lsKey, localPath);
                        cache.images[person.id] = localPath;
                        return localPath;
                    }
                } catch (e) {
                    console.warn('تصویر محلی یافت نشد:', localPath);
                }
            }

            // تلاش از ویکی‌پدیا (کش در localStorage)
            const storedWiki = localStorage.getItem(lsWikiKey);
            if (storedWiki) { localStorage.setItem(lsKey, storedWiki); cache.images[person.id] = storedWiki; return storedWiki; }

            try {
                const title = person.name.replace(/\s+/g, '_');
                const api = `https://fa.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&piprop=thumbnail&pithumbsize=400&origin=*`;
                const res = await fetch(api).then(r => r.json());
                const pages = res.query?.pages;
                const page = pages && Object.values(pages)[0];
                if (page?.thumbnail?.source) {
                    localStorage.setItem(lsWikiKey, page.thumbnail.source);
                    localStorage.setItem(lsKey, page.thumbnail.source);
                    cache.images[person.id] = page.thumbnail.source;
                    return page.thumbnail.source;
                }
            } catch (e) {
                console.warn('خطا در دریافت تصویر از ویکی‌پدیا:', e);
            }

            // تصویر پیش‌فرض
            localStorage.setItem(lsKey, placeholder);
            cache.images[person.id] = placeholder;
            return placeholder;
        }

        async function fetchPersonDescription(person) {
            const lsKey = `description_${person.id}`;
            const ls = localStorage.getItem(lsKey);
            if (ls) { cache.wikiExtracts[person.id] = ls; return ls; }
            if (cache.wikiExtracts[person.id]) return cache.wikiExtracts[person.id];

            try {
                const title = person.name.replace(/\s+/g, '_');
                const api = `https://fa.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=extracts&exintro&explaintext&format=json&origin=*`;
                const res = await fetch(api).then(r => r.json());
                const pages = res.query?.pages;
                const page = pages && Object.values(pages)[0];
                if (page?.extract) {
                    localStorage.setItem(lsKey, page.extract);
                    cache.wikiExtracts[person.id] = page.extract;
                    return page.extract;
                }
            } catch (e) { console.warn('wiki extract fail', e); }

            const fallback = person.bio || 'اطلاعاتی در دسترس نیست.';
            localStorage.setItem(lsKey, fallback);
            return fallback;
        }

        async function getAlbum(person) {
            const lsKey = `album_${person.id}`;
            const ls = localStorage.getItem(lsKey);
            if (ls) {
                try { const arr = JSON.parse(ls); cache.album[person.id] = arr; return arr; } catch (e) { }
            }
            if (cache.album[person.id]) return cache.album[person.id];
            const images = [];

            // اگر آبجکت دارای گالری است از آن استفاده کن
            if (person.gallery && person.gallery.length) {
                cache.album[person.id] = person.gallery;
                localStorage.setItem(lsKey, JSON.stringify(person.gallery));
                return person.gallery;
            }

            // بررسی تصاویر محلی با الگوی "نام 1.jpg", "نام 2.jpg", ... (تا 100 تصویر)
            const base = person.name.trim();
            for (let i = 1; i <= 100; i++) {
                const name = `${base} ${i}.jpg`;
                const found = await getImageLocal(name);
                if (found) images.push(found);
            }
            cache.album[person.id] = images;
            localStorage.setItem(lsKey, JSON.stringify(images));
            return images;
        }

        // محاسبه سن با استفاده از birthYear یا فیلد age موجود
        function calcAge(p) {
            if (p.age) return p.age;
            if (p.birthYear) {
                // تبدیل تقویم شمسی به سال مرجع مشابه index.html (تقریبی)
                const currentYear = new Date().getFullYear() - 621;
                const ref = p.daydeath || currentYear;
                return ref - p.birthYear;
            }
            return 'نامشخص';
        }

        // بارگذاری داده‌ها از baz.json
        async function loadData() {
            try {
                const res = await fetch('baz.json');
                if (!res.ok) throw new Error('بارگذاری baz.json ناموفق');
                const json = await res.json();
                data = json.map(p => ({
                    ...p,
                    id: p.id || `${p.name.replace(/\s+/g, '_')}_${Date.now()}`,
                    birthYear: parseInt(p.birthYear) || null
                }));
                renderActors();
            } catch (e) {
                $('#actorsGrid').html(`
                    <div class="col-span-full text-center text-red-400 py-12">
                        خطا در بارگذاری داده‌ها: ${e.message}
                    </div>`);
                console.error(e);
            }
        }

        // فیلتر و رندر (jQuery)
        async function renderActors() {
            const $grid = $('#actorsGrid');
            const $noResults = $('#noResults');

            let list = data.filter(p => {
                const nameMatch = p.name.toLowerCase().includes((filters.search || '').toLowerCase());
                const genderMatch = filters.gender === 'all' || p.gender === filters.gender;
                const age = calcAge(p);
                const numericAge = typeof age === 'number' ? age : null;
                const ageMatch = numericAge === null ? true :
                    (filters.ageDirection === 'up' ? numericAge >= filters.ageLimit : numericAge <= filters.ageLimit);
                return nameMatch && genderMatch && ageMatch;
            });

            // مرتب‌سازی
            if (filters.sortBy === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
            else if (filters.sortBy === 'ageDesc') list.sort((a, b) => (calcAge(b) || 0) - (calcAge(a) || 0));
            else if (filters.sortBy === 'ageAsc') list.sort((a, b) => (calcAge(a) || 0) - (calcAge(b) || 0));

            $grid.empty();
            if (!list.length) { $noResults.removeClass('hidden'); return; }
            $noResults.addClass('hidden');

            for (const person of list) {
                const imgSrc = await fetchPersonImage(person);
                const isFav = favorites.includes(person.id);
                const cardHtml = `
                <div class="actor-card group relative bg-slate-800 rounded-2xl overflow-hidden cursor-pointer shadow transition">
                    <div class="aspect-[2/3] overflow-hidden">
                        <img src="${imgSrc}" alt="${person.name}" class="w-full h-full object-cover grayscale group-hover:grayscale-0">
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-50 group-hover:opacity-80"></div>
                    <div class="absolute bottom-0 left-0 right-0 p-4">
                        <div class="flex justify-between items-end">
                            <div>
                                <h3 class="font-bold text-white">${person.name}</h3>
                                <p class="text-xs text-blue-400">${calcAge(person)} سال | ${person.gender || ''}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button data-id="${person.id}" class="fav-btn p-2 rounded-full ${isFav ? 'bg-red-500 text-white' : 'bg-black/20 text-white/60'}">
                                    <i data-lucide="heart" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
                $grid.append(cardHtml);
            }

            $grid.off('click', '.actor-card').on('click', '.actor-card', function () {
                const id = $(this).find('.fav-btn').data('id');
                openModal(id);
            });

            $grid.off('click', '.fav-btn').on('click', '.fav-btn', function (ev) {
                ev.stopPropagation();
                const id = $(this).data('id');
                toggleFavorite(id);
                renderActors();
            });

            lucide.createIcons();
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) favorites = favorites.filter(x => x !== id);
            else favorites.push(id);
            saveFavs();
        }

        // مودال (jQuery)
        async function openModal(id) {
            const person = data.find(p => p.id === id);
            if (!person) return;
            const $modal = $('#actorModal');
            const $img = $('#modalImg');
            const $name = $('#modalName');
            const $age = $('#modalAge');
            const $status = $('#modalStatus');
            const $bio = $('#modalBio');
            const $gallery = $('#modalGallery');
            const $favBtn = $('#modalFavBtn');
            const $wikiLink = $('#wikiLink');
            const $downloadBtn = $('#downloadBtn');

            $img.attr('src', await fetchPersonImage(person));
            $name.text(person.name);
            $age.text(calcAge(person) + ' سال');
            $status.text(person.status || '');
            $bio.text(await fetchPersonDescription(person));

            $gallery.html('<div class="text-slate-400">در حال بارگذاری...</div>');
            const album = await getAlbum(person);
            if (!album.length) $gallery.html('<p class="text-xs text-slate-400">آلبومی در دسترس نیست</p>');
            else $gallery.html(album.map(src => `<img src="${src}" class="w-20 h-20 object-cover rounded-lg cursor-pointer">`).join(''));

            const isFav = favorites.includes(person.id);
            $favBtn.attr('class', isFav ? 'p-3 rounded-2xl bg-red-500 text-white' : 'p-3 rounded-2xl bg-slate-800 hover:bg-slate-700');
            $favBtn.off('click').on('click', function () {
                toggleFavorite(person.id);
                setFavCount();
                if (!$('#favoritesView').hasClass('hidden')) renderFavoritesGrid();
                openModal(person.id);
                renderActors();
            });

            $wikiLink.attr('href', `https://fa.wikipedia.org/wiki/${encodeURIComponent(person.name)}`);
            $downloadBtn.off('click').on('click', function () { window.open($img.attr('src'), '_blank'); });

            $gallery.off('click', 'img').on('click', 'img', function () { window.open($(this).attr('src'), '_blank'); });

            $modal.removeClass('hidden').addClass('flex');
            lucide.createIcons();
        }

        function closeModal() { $('#actorModal').addClass('hidden').removeClass('flex'); }

        // رویدادها و کنترل‌ها (jQuery)
        function setupControls() {
            $('#toggleFavorites').on('click', function () {
                const $main = $('main');
                const $favView = $('#favoritesView');
                const $btn = $('#toggleFavorites');
                const showing = !$favView.hasClass('hidden');
                if (!showing) {
                    $main.addClass('hidden');
                    $favView.removeClass('hidden');
                    $btn.addClass('bg-slate-800');
                    renderFavoritesGrid();
                } else {
                    $main.removeClass('hidden');
                    $favView.addClass('hidden');
                    $btn.removeClass('bg-slate-800');
                    renderActors();
                }
            });

            $('#favBackBtn').on('click', function () {
                $('#favoritesView').addClass('hidden');
                $('main').removeClass('hidden');
                $('#toggleFavorites').removeClass('bg-slate-800');
                renderActors();
            });

            $(document).on('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
            // Modal close handlers (overlay and close button)
            $('#modalOverlay').on('click', closeModal);
            $('#modalCloseBtn').on('click', closeModal);
        }

        // ذخیره و بازیابی فیلترها
        function saveFilters() { localStorage.setItem('filters', JSON.stringify(filters)); }

        function restoreFilters() {
            const saved = localStorage.getItem('filters');
            if (saved) {
                try { const obj = JSON.parse(saved); Object.assign(filters, obj); } catch (e) { }
            }
            $('#searchInput').val(filters.search || '');
            $('.gender-btn').each(function () {
                if ($(this).data('gender') === (filters.gender || 'all')) { $(this).removeClass('bg-slate-800').addClass('bg-blue-600'); }
                else { $(this).removeClass('bg-blue-600').addClass('bg-slate-800'); }
            });
            $('#ageRange').val(filters.ageLimit);
            $('#sortOrder').val(filters.sortBy || 'name');
            updateAgeLabel();
        }

        function updateAgeLabel() { $('#ageLabel').text((filters.ageDirection === 'up' ? 'حداقل: ' : 'حداکثر: ') + filters.ageLimit); }

        async function renderFavoritesGrid() {
            const $grid = $('#favoritesGrid');
            const $noFavs = $('#noFavs');
            const favIds = favorites;
            const favoriteItems = data.filter(p => favIds.includes(p.id));

            $grid.empty();
            if (!favoriteItems.length) { $noFavs.removeClass('hidden'); return; }
            $noFavs.addClass('hidden');

            for (const person of favoriteItems) {
                const imgSrc = await fetchPersonImage(person);
                const isFav = favorites.includes(person.id);
                const cardHtml = `
                <div class="actor-card group relative bg-slate-800 rounded-2xl overflow-hidden cursor-pointer shadow transition">
                    <div class="aspect-[2/3] overflow-hidden">
                        <img src="${imgSrc}" alt="${person.name}" class="w-full h-full object-cover grayscale group-hover:grayscale-0">
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-50 group-hover:opacity-80"></div>
                    <div class="absolute bottom-0 left-0 right-0 p-4">
                        <div class="flex justify-between items-end">
                            <div>
                                <h3 class="font-bold text-white">${person.name}</h3>
                                <p class="text-xs text-blue-400">${calcAge(person)} سال | ${person.gender || ''}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button data-id="${person.id}" class="fav-btn p-2 rounded-full ${isFav ? 'bg-red-500 text-white' : 'bg-black/20 text-white/60'}">
                                    <i data-lucide="heart" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
                $grid.append(cardHtml);
            }

            $grid.off('click', '.actor-card').on('click', '.actor-card', function () {
                const id = $(this).find('.fav-btn').data('id');
                openModal(id);
            });

            $grid.off('click', '.fav-btn').on('click', '.fav-btn', function (ev) {
                ev.stopPropagation();
                const id = $(this).data('id');
                toggleFavorite(id);
                renderFavoritesGrid();
                setFavCount();
                renderActors();
            });

            lucide.createIcons();
        }

        // به‌روزرسانی رویدادها برای ذخیره فیلترها (jQuery)
        $('#searchInput').on('input', function () { filters.search = $(this).val().trim(); saveFilters(); renderActors(); });
        $('.gender-btn').on('click', function () {
            $('.gender-btn').removeClass('bg-blue-600').addClass('bg-slate-800');
            $(this).removeClass('bg-slate-800').addClass('bg-blue-600');
            filters.gender = $(this).data('gender'); saveFilters(); renderActors();
        });
        $('#ageRange').on('input', function () { filters.ageLimit = parseInt($(this).val()); saveFilters(); updateAgeLabel(); renderActors(); });
        $('#ageDir').on('click', function () { filters.ageDirection = filters.ageDirection === 'up' ? 'down' : 'up'; saveFilters(); updateAgeLabel(); renderActors(); });
        $('#sortOrder').on('change', function () { filters.sortBy = $(this).val(); saveFilters(); renderActors(); });

        // مقداردهی اولیه
        (function init() {
            setFavCount();
            setupControls();
            restoreFilters();
            loadData();
            lucide.createIcons();
        })();
    </script>
</body>

</html>
